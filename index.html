<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartAgri - 농업 기후·개화 정보 알림장</title>

  <!-- PWA 설정 (선생님 수업 자료 유지) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2E7D32">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    /* ==========================================
       1. CSS 변수 정의 (라이트/다크 모드 지원)
       ========================================== */
    :root {
      --bg-color: #f4f7f4;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --sub-text: #666666;
      --border-color: #dcdcdc;
      --primary-color: #2E7D32; /* 농업 테마 초록색 */
      --primary-hover: #1B5E20;
      --disabled-color: #cccccc;
    }

    [data-theme="dark"] {
      --bg-color: #121812;
      --card-bg: #1e261e;
      --text-color: #e0e6e0;
      --sub-text: #a0aaa0;
      --border-color: #334433;
      --primary-color: #4CAF50;
      --primary-hover: #388E3C;
      --disabled-color: #444444;
    }

    /* ==========================================
       2. 기본 레이아웃 스타일
       ========================================== */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      max-width: 440px;
      margin: 0 auto;
      transition: background-color 0.3s, color 0.3s;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    h3 {
      margin: 0;
      font-size: 1.15rem;
      color: var(--primary-color);
    }

    .theme-btn {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
    }

    .card {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 5px;
      color: var(--sub-text);
    }

    select, input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: var(--card-bg);
      color: var(--text-color);
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--primary-color);
    }

    .send-btn {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .send-btn:hover {
      background-color: var(--primary-hover);
    }

    .send-btn:disabled {
      background-color: var(--disabled-color);
      cursor: not-allowed;
    }

    #status {
      margin-top: 12px;
      font-size: 13px;
      text-align: center;
      min-height: 18px;
    }
  </style>
</head>
<body>

  <!-- 헤더 영역 (제목 및 테마 전환 버튼) -->
  <div class="header">
    <h3>🌱 SmartAgri 기후·개화 메모장</h3>
    <button type="button" class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙 다크 모드</button>
  </div>

  <!-- 입력 폼 카드 -->
  <div class="card">
    <!-- 1. 지역 선택 -->
    <div class="form-group">
      <label for="regionSelect">📍 농가 지역</label>
      <select id="regionSelect">
        <option value="서울/경기">서울 / 경기</option>
        <option value="강원">강원도</option>
        <option value="충청">충청도</option>
        <option value="전라">전라도</option>
        <option value="경상">경상도</option>
        <option value="제주">제주도</option>
      </select>
    </div>

    <!-- 2. 관찰 항목 선택 -->
    <div class="form-group">
      <label for="categorySelect">🔍 기후 및 생육 관찰 항목</label>
      <select id="categorySelect">
        <option value="개화 시기 변동">🌸 개화 시기 변동 (조기/지연)</option>
        <option value="이상 기후 현상">🌡️ 이상 기류 (고온/저온/냉해)</option>
        <option value="수분·강수 상태">🌧️ 강수량 / 가뭄 / 과습</option>
        <option value="병해충 발생">🐛 병해충 발생 제보</option>
        <option value="일반 메모">📝 기타 농업 일지 메모</option>
      </select>
    </div>

    <!-- 3. 상세 내용 입력 -->
    <div class="form-group">
      <label for="memoInput">✏️ 상세 관찰 정보</label>
      <input type="text" id="memoInput" placeholder="예: 평년보다 개화가 4일 빠름 (작물: 배나무)" onkeyup="handleKeyUp(event)">
    </div>

    <!-- 전송 버튼 및 상태 표시 -->
    <button type="button" id="sendBtn" class="send-btn" onclick="sendMemo()">구글 시트에 제보 저장</button>
    <div id="status"></div>
  </div>

  <script>
    // ----------------------------------------------------
    // 1. 서비스 워커 등록 (PWA 기능 유지)
    // ----------------------------------------------------
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker Registered'))
        .catch(err => console.log('SW Registration Failed:', err));
    }

    // ----------------------------------------------------
    // 2. 구글 앱 스크립트 웹 앱 URL (배포한 URL을 붙여넣으세요)
    // ----------------------------------------------------
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx3MQ6HmdnA7e6SmbnBICk3fzYObItdu3qFGi55O1EsWPb5crsMvekZgPNAoTKgblu5/exec";

    // ----------------------------------------------------
    // 3. 백엔드(GAS)로 메모 전송 함수
    // ----------------------------------------------------
    async function sendMemo() {
      const region = document.getElementById('regionSelect').value;
      const category = document.getElementById('categorySelect').value;
      const input = document.getElementById('memoInput');
      const btn = document.getElementById('sendBtn');
      const status = document.getElementById('status');
      const detailText = input.value.trim();

      if (!detailText) {
        alert('상세 관찰 정보를 입력하세요.');
        input.focus();
        return;
      }

      if (GAS_URL.includes("여기에_1단계")) {
        alert('GAS_URL 변수에 1단계 웹 앱 URL을 붙여넣어 주세요!');
        return;
      }

      // 백엔드 Code.gs의 data.memo 규칙에 맞춰 데이터를 하나로 조합합니다.
      const formattedMemo = `[${region} / ${category}] ${detailText}`;

      btn.disabled = true;
      status.style.color = 'var(--sub-text)';
      status.innerText = '⏳ 구글 시트에 저장 중...';

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ memo: formattedMemo })
        });

        const result = await res.json();
        
        if (result.result !== 'success') {
          throw new Error(result.message || '서버 저장 실패');
        }

        input.value = '';
        status.style.color = 'var(--primary-color)';
        status.innerText = '✅ 성공적으로 저장되었습니다!';
        setTimeout(() => { status.innerText = ''; }, 3000);

      } catch (err) {
        status.style.color = '#e74c3c';
        status.innerText = '❌ 저장 실패: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    // 엔터키 입력 시 전송 실행
    function handleKeyUp(event) {
      if (event.key === 'Enter') {
        sendMemo();
      }
    }

    // ----------------------------------------------------
    // 4. 다크 모드 / 라이트 모드 전환 로직
    // ----------------------------------------------------
    function initTheme() {
      const savedTheme = localStorage.getItem('agri_theme') || 'light';
      if (savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.getElementById('themeBtn').innerText = '☀️ 라이트 모드';
      }
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const themeBtn = document.getElementById('themeBtn');

      if (currentTheme === 'dark') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('agri_theme', 'light');
        themeBtn.innerText = '🌙 다크 모드';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('agri_theme', 'dark');
        themeBtn.innerText = '☀️ 라이트 모드';
      }
    }

    // 페이지 시작 시 기존 선택한 테마 적용
    initTheme();
  </script>
</body>
</html>
